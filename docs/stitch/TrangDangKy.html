<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản bệnh nhân - Smart Clinic</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;850&display=swap"
      rel="stylesheet"
    />

    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- Google Material Symbols Outlined -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,400..700,0..1,-50..200"
    />

    <style>
      :root {
        --primary: #1a73e8;
        --primary-hover: #1557b0;
        --text-main: #0f172a;
        --text-muted: #64748b;
        --border-color: #dce5f2;
        --surface-low: #f8fafc;
        --surface-lowest: #ffffff;
        --shadow-md: 0 10px 30px rgba(15, 23, 42, 0.08);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        color: var(--text-main);
        background-color: var(--surface-low);
        font-size: 14px;
        line-height: 1.5;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
      }

      .auth-wrapper {
        width: 100%;
        max-width: 440px;
        padding: 0 12px;
      }

      .auth-brand {
        text-align: center;
        margin-bottom: 24px;
      }

      .auth-brand .brand-icon {
        font-size: 48px;
        color: var(--primary);
      }

      .auth-brand h1 {
        font-size: 24px;
        font-weight: 750;
        color: var(--primary);
        letter-spacing: -0.02em;
        margin-top: 6px;
        margin-bottom: 2px;
      }

      .auth-brand p {
        font-size: 13.5px;
        color: var(--text-muted);
        margin: 0;
      }

      /* Card biểu mẫu */
      .auth-card {
        background-color: var(--surface-lowest);
        border-radius: 16px;
        border: 1px solid var(--border-color);
        box-shadow: var(--shadow-md);
        padding: 32px 28px;
      }

      .auth-card h2 {
        font-size: 20px;
        font-weight: 700;
        color: #0f172a;
        margin-bottom: 4px;
      }

      .auth-card .subtitle {
        font-size: 13px;
        color: var(--text-muted);
        margin-bottom: 20px;
      }

      .form-label {
        font-size: 13px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 6px;
      }

      .form-control {
        height: 44px;
        border-radius: 9px;
        border: 1.5px solid #cbd5e1;
        font-size: 14px;
        padding: 0 14px;
        background-color: #ffffff;
        transition: all 0.15s;
      }

      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(26, 115, 232, 0.14);
        outline: none;
      }

      .btn-primary {
        background-color: var(--primary);
        border-color: var(--primary);
        font-weight: 600;
        font-size: 14px;
        height: 44px;
        border-radius: 9px;
        transition: background-color 0.15s;
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
        border-color: var(--primary-hover);
      }

      .btn-outline-secondary {
        height: 44px;
        border-radius: 9px;
        border: 1.5px solid #cbd5e1;
        color: #334155;
        font-size: 13.5px;
        font-weight: 600;
        background-color: #ffffff;
        transition: all 0.15s;
      }

      .btn-outline-secondary:hover {
        background-color: #f8fafc;
        border-color: #94a3b8;
        color: #0f172a;
      }

      .divider-text {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 20px 0;
      }

      .divider-text::before,
      .divider-text::after {
        content: '';
        flex: 1;
        border-top: 1px solid #e2e8f0;
      }

      .divider-text span {
        font-size: 12.5px;
        color: var(--text-muted);
      }

      .auth-footer-links {
        margin-top: 24px;
        text-align: center;
      }

      .auth-footer-links a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      .auth-footer-links a:hover {
        text-decoration: underline;
      }

      /* Toast Notification */
      .toast-container {
        position: fixed;
        top: 24px;
        right: 24px;
        z-index: 1055;
      }
    </style>
  </head>
  <body>
    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <div class="auth-wrapper">
      <!-- Thương hiệu Smart Clinic (Tương ứng AuthLayout) -->
      <div class="auth-brand">
        <a href="giaodientrangchu.html" class="text-decoration-none">
          <span class="material-symbols-outlined brand-icon">medical_services</span>
          <h1>Smart Clinic</h1>
          <p>Chăm sóc sức khỏe thông minh</p>
        </a>
      </div>

      <!-- Biểu mẫu đăng ký (Tương ứng TrangDangKy.tsx) -->
      <div class="auth-card">
        <section aria-labelledby="register-title">
          <h2 id="register-title">Tạo tài khoản bệnh nhân</h2>
          <p class="subtitle">
            Đăng ký tài khoản để đặt lịch khám và quản lý hồ sơ khám bệnh.
          </p>

          <form id="registerForm" aria-label="Biểu mẫu đăng ký bệnh nhân">
            <!-- Họ và tên -->
            <div class="mb-3">
              <label class="form-label" for="register-full-name">Họ và tên</label>
              <input
                id="register-full-name"
                class="form-control"
                type="text"
                placeholder="Nguyễn Văn A"
                autocomplete="name"
                required
              />
            </div>

            <!-- Số điện thoại -->
            <div class="mb-3">
              <label class="form-label" for="register-phone">Số điện thoại</label>
              <input
                id="register-phone"
                class="form-control"
                type="tel"
                placeholder="0901234567"
                autocomplete="tel"
                required
              />
            </div>

            <!-- Mật khẩu -->
            <div class="mb-3">
              <label class="form-label" for="register-password">Mật khẩu</label>
              <input
                id="register-password"
                class="form-control"
                type="password"
                placeholder="Mật khẩu tối thiểu 8 ký tự"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </div>

            <!-- Nút đăng ký -->
            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
              Đăng ký
            </button>

            <!-- Đường phân cách hoặc -->
            <div class="divider-text" aria-hidden="true">
              <span>hoặc</span>
            </div>

            <!-- Nút đăng nhập Google -->
            <button
              type="button"
              class="btn btn-outline-secondary w-100 d-flex align-items-center justify-content-center gap-2"
              id="googleLoginBtn"
              title="Đăng nhập với Google"
            >
              <!-- SVG Google chuẩn SVG từ React component -->
              <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
                <path
                  fill="#4285F4"
                  d="M21.6 12.23c0-.71-.06-1.39-.18-2.05H12v3.88h5.38a4.6 4.6 0 0 1-1.99 3.02v2.51h3.23c1.89-1.74 2.98-4.3 2.98-7.36Z"
                />
                <path
                  fill="#34A853"
                  d="M12 22c2.7 0 4.96-.9 6.62-2.41l-3.23-2.51c-.9.6-2.05.96-3.39.96-2.6 0-4.8-1.75-5.59-4.11H3.08v2.59A10 10 0 0 0 12 22Z"
                />
                <path
                  fill="#FBBC05"
                  d="M6.41 13.93A6 6 0 0 1 6.1 12c0-.67.11-1.31.31-1.93V7.48H3.08A10 10 0 0 0 2 12c0 1.62.39 3.15 1.08 4.52l3.33-2.59Z"
                />
                <path
                  fill="#EA4335"
                  d="M12 5.96c1.47 0 2.79.51 3.83 1.51l2.87-2.87C16.96 2.98 14.7 2 12 2a10 10 0 0 0-8.92 5.48l3.33 2.59C7.2 7.71 9.4 5.96 12 5.96Z"
                />
              </svg>
              Đăng nhập với Google
            </button>
          </form>

          <!-- Liên kết chân form -->
          <div class="auth-footer-links">
            <p class="text-secondary small mb-2">
              Đã có tài khoản?
              <a href="#">Đăng nhập</a>
            </p>
            <p class="text-secondary small mb-0">
              <a href="giaodientrangchu.html">← Về trang chủ</a>
            </p>
          </div>
        </section>
      </div>
    </div>

    <!-- Bootstrap 5 Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- JavaScript tương tác mô phỏng TrangDangKy.tsx -->
    <script>
      function showToast(message, type = 'info') {
        const toastContainer = document.getElementById('toastContainer');
        const toastEl = document.createElement('div');
        toastEl.className = 'toast align-items-center text-bg-light border shadow-sm show mb-2';
        toastEl.setAttribute('role', 'alert');
        toastEl.setAttribute('aria-live', 'assertive');
        toastEl.setAttribute('aria-atomic', 'true');

        toastEl.innerHTML = `
          <div class="d-flex">
            <div class="toast-body d-flex align-items-center gap-2">
              <i class="bi bi-info-circle-fill text-primary"></i>
              <span>${message}</span>
            </div>
            <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
          </div>
        `;

        toastContainer.appendChild(toastEl);

        setTimeout(() => {
          toastEl.classList.remove('show');
          setTimeout(() => toastEl.remove(), 300);
        }, 3500);
      }

      const form = document.getElementById('registerForm');
      const submitBtn = document.getElementById('submitBtn');
      const googleBtn = document.getElementById('googleLoginBtn');

      form.addEventListener('submit', function (e) {
        e.preventDefault();
        submitBtn.disabled = true;
        submitBtn.textContent = 'Đang kiểm tra thông tin...';

        setTimeout(() => {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Đăng ký';
          showToast('Đăng ký trực tuyến sẽ được kết nối với xác thực số điện thoại.', 'info');
        }, 500);
      });

      googleBtn.addEventListener('click', function () {
        showToast('Đăng nhập với Google sẽ được kết nối trong giai đoạn xác thực tài khoản.', 'info');
      });
    </script>
  </body>
</html>
